    <div>
<h1> Ingrese su numero 1</h1>
<input id="input1" type="number">
<button onclick="
let value1 = document.querySelector('#input1').value

if (value1 < 576){
    document.querySelector('#holajaja').innerHTML = 'El tamaño de la pantalla es xs'
}
else if(value1 < 768){
    document.querySelector('#holajaja').innerHTML = 'El tamaño de la pantalla es sm'
}
else if(value1 < 962){
    document.querySelector('#holajaja').innerHTML = 'El tamaño de la pantalla es md'
}
else if(value1 < 1199){
    document.querySelector('#holajaja').innerHTML = 'El tamaño de la pantalla es xl'
}
else{
    document.querySelector('#holajaja').innerHTML = 'El tamaño de la pantalla es xxl'
}


"> Verificar </button>
<h1 id="holajaja">Verificacion </h1>
